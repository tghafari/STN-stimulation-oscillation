name: Format all-channel group Python scripts

on:
  push:
    branches:
      - style/pep8-all-channel-group

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install formatter
        run: python -m pip install black==25.1.0
      - name: Format only group EEG all-channel Python files
        run: python -m black --line-length 88 analysis/group/EEG_all_channels
      - name: Check Python syntax
        run: python -m compileall -q analysis/group/EEG_all_channels
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/group/EEG_all_channels/*.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply Black PEP 8 formatting to all-channel group scripts"
            git push origin HEAD:${{ github.ref_name }}
          fi
