# Formatting configuration for the STN EEG analysis repository.
# Run formatting locally, inspect the diff, then commit.
[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", ".venv", "build", "dist"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Enable broader PEP 8/style checks after refactoring the legacy scripts.
